<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>JH IPTV</title>
<meta name="theme-color" content="#0A0E1C">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<style>
.qcard{margin-bottom:18px;display:grid;gap:10px}
.qh{font-size:14px;letter-spacing:.02em;color:var(--muted);font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qlist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.qlist .qn{flex:1 1 auto;min-width:0;display:grid}
.qlist .qn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlist .qn small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlist button{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.qlist button:hover{color:var(--fg,#fff);border-color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/logo.svg" alt="" width="36" height="36"><span>JH <b>IPTV</b></span></a>
    <div class="lang"><select id="langSel" aria-label="Idioma / Language">
      <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option>
    </select></div>
  </div>
</header>

<main class="pair">
  <!-- 1) código -->
  <div id="vCode" hidden>
    <h1 data-i="h"></h1>
    <p class="lead" data-i="help"></p>
    <form class="card" id="codeForm" novalidate>
      <label><span data-i="code_l"></span><input id="codeIn" class="codein" maxlength="14" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" inputmode="text"></label>
      <button class="btn primary" type="submit" data-i="code_btn"></button>
      <div class="msg" id="codeMsg" role="status"></div>
    </form>
  </div>

  <!-- 2) dados da lista -->
  <div id="vForm" hidden>
    <h1 data-i="h"></h1>
    <p class="lead" data-i="lead"></p>
    <div class="tvcode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 2.5l3 2.5 3-2.5M7 20.5h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><small data-i="linked"></small><b id="codeShow"></b></div>
      <button type="button" id="chg" data-i="change"></button>
    </div>
    <div class="card qcard" id="qCard" hidden>
      <b class="qh" data-i="queue_h"></b>
      <ul class="qlist" id="qList"></ul>
    </div>
    <form class="card" id="listForm" novalidate autocomplete="off">
      <div class="seg" role="group">
        <button type="button" id="tX" aria-pressed="true">Xtream Codes</button>
        <button type="button" id="tM" aria-pressed="false" data-i="tab_m"></button>
      </div>
      <label><span data-i="f_name"></span><input id="fName" maxlength="40" data-ip="p_name"></label>
      <div id="xF" style="display:grid;gap:16px">
        <label><span data-i="f_srv"></span><input id="fServer" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="http://servidor.com:8080"></label>
        <label><span data-i="f_user"></span><input id="fUser" autocapitalize="off" spellcheck="false"></label>
        <label><span data-i="f_pass"></span><span class="pw"><input id="fPass" type="password" autocapitalize="off" spellcheck="false" autocomplete="off"><button type="button" id="pwT" data-i="show"></button></span></label>
      </div>
      <div id="mF" style="display:none;gap:16px">
        <label><span data-i="f_m3u"></span><input id="fM3u" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="http://…/get.php?username=…"></label>
        <label><span data-i="f_epg"></span><input id="fEpg" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="http://…/xmltv.php?…"></label>
      </div>
      <button class="btn" type="button" id="moreBtn"><span data-i="add_more"></span></button>
      <p class="fine" data-i="more_hint"></p>
      <button class="btn primary" type="submit" id="sendBtn"><span id="sendLbl"></span></button>
      <div class="msg" id="formMsg" role="status" aria-live="polite"></div>
      <p class="fine" data-i="foot"></p>
    </form>
  </div>

  <!-- 3) enviado -->
  <div id="vDone" class="done" hidden>
    <div class="big"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1 data-i="done_h"></h1>
    <p class="lead" id="doneP" data-i="done_p" style="margin:0 auto 26px"></p>
    <button class="btn" type="button" id="again" data-i="again"></button>
  </div>
</main>

<script src="/site.js"></script>
<script src="/nacl.min.js"></script>
<script src="/pair.js"></script>

(function(){
  var $=function(i){return document.getElementById(i)},code="",tab="x";
  jhInit(I18N_TV);
  function view(v){["vCode","vForm","vDone"].forEach(function(k){$(k).hidden=k!==v});window.scrollTo(0,0)}
  function msg(id,t){var m=$(id);m.textContent=t||"";m.className=t?"msg err":"msg"}
  function useCode(c){code=JHPAIR.norm(c);$("codeShow").textContent=JHPAIR.fmt(code);view("vForm");setTimeout(function(){$("fName").focus()},50)}
  function setTab(t){tab=t;$("tX").setAttribute("aria-pressed",t==="x");$("tM").setAttribute("aria-pressed",t==="m");$("xF").style.display=t==="x"?"grid":"none";$("mF").style.display=t==="m"?"grid":"none";msg("formMsg","")}
  $("tX").onclick=function(){setTab("x")};$("tM").onclick=function(){setTab("m")};
  window.jhOnLang=function(){$("pwT").textContent=jt($("fPass").type==="password"?"show":"hide")};
  $("pwT").onclick=function(){var p=$("fPass");p.type=p.type==="password"?"text":"password";window.jhOnLang()};
  /* código vindo do QR (#XXXX…) — fica só no telemóvel; o "#" nunca é enviado ao servidor */
  var h=decodeURIComponent((location.hash||"").slice(1));
  if(h&&JHPAIR.valid(h)){useCode(h);try{history.replaceState(null,"",location.pathname)}catch(e){}}else view("vCode");
  $("codeForm").onsubmit=function(e){e.preventDefault();var v=$("codeIn").value;if(!JHPAIR.valid(v)){msg("codeMsg",jt("code_err"));return}msg("codeMsg","");useCode(v)};
  $("codeIn").addEventListener("input",function(){var c=JHPAIR.norm(this.value).slice(0,12),o=c.replace(/(.{4})(?=.)/g,"$1-");if(o!==this.value)this.value=o});
  $("chg").onclick=function(){code="";$("codeIn").value="";view("vCode");$("codeIn").focus()};
  $("again").onclick=function(){view("vForm")};
  function fixUrl(u){u=u.trim();if(u&&!/^https?:\/\//i.test(u))u="http://"+u;return u.replace(/\s+/g,"")}
  var queue=[];
  function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function formEmpty(){return tab==="x"?!($("fServer").value.trim()||$("fUser").value.trim()||$("fPass").value):!($("fM3u").value.trim()||$("fEpg").value.trim())}
  function collect(){
    var o={v:1,t:Date.now(),name:$("fName").value.trim()};
    if(tab==="x"){o.type="xtream";o.server=fixUrl($("fServer").value).replace(/\/+$/,"");o.user=$("fUser").value.trim();o.pass=$("fPass").value;
      if(!/^https?:\/\/[^\s/]+/i.test(o.server)||!o.user||!o.pass){msg("formMsg",jt("e_x"));return null}}
    else{o.type="m3u";o.url=fixUrl($("fM3u").value);o.epg=fixUrl($("fEpg").value);
      if(!/^https?:\/\/\S+\.\S+/i.test(o.url)){msg("formMsg",jt("e_m"));return null}}
    return o}
  function clearForm(){["fName","fServer","fUser","fPass","fM3u","fEpg"].forEach(function(k){$(k).value=""});msg("formMsg","")}
  function host(u){return String(u||"").replace(/^https?:\/\//i,"").split(/[\/?#]/)[0]}
  function total(){return queue.length+(formEmpty()?0:1)}
  function label(){var n=total();$("sendLbl").textContent=n>1?jt("send_n").replace("{n}",n):jt("send")}
  function drawQ(){$("qCard").hidden=!queue.length;
    $("qList").innerHTML=queue.map(function(o,i){return'<li><span class="qn"><b>'+esc(o.name||host(o.type==="xtream"?o.server:o.url))+'</b><small>'+esc(o.type==="xtream"?"Xtream Codes · "+host(o.server):"M3U · "+host(o.url))+'</small></span><button type="button" data-q="'+i+'">'+esc(jt("remove"))+'</button></li>'}).join("");label()}
  $("qList").onclick=function(e){var b=e.target.closest?e.target.closest("[data-q]"):null;if(!b)return;queue.splice(+b.getAttribute("data-q"),1);drawQ()};
  $("moreBtn").onclick=function(){var o=collect();if(!o)return;queue.push(o);clearForm();drawQ();window.scrollTo(0,0);setTimeout(function(){$("fName").focus()},50)};
  $("listForm").addEventListener("input",label);
  var jl0=window.jhOnLang;window.jhOnLang=function(){if(jl0)jl0();drawQ()};drawQ();
  function post(o){var body=JHPAIR.seal(code,o);return fetch(JHPAIR.topicUrl(code),{method:"POST",body:body,cache:"no-store",referrerPolicy:"no-referrer"}).then(function(r){if(!r.ok)throw 0})}
  /* várias listas: vão juntas (em partes pequenas, se forem muitas); a primeira segue também no formato antigo, para TVs com a app por atualizar */
  function parts(items){var out=[],cur=[];items.forEach(function(o){var it={type:o.type,name:o.name};if(o.type==="xtream"){it.server=o.server;it.user=o.user;it.pass=o.pass}else{it.url=o.url;it.epg=o.epg}
      if(cur.length&&JSON.stringify(cur.concat([it])).length>1800){out.push(cur);cur=[]}cur.push(it)});if(cur.length)out.push(cur);return out}
  $("listForm").onsubmit=function(e){
    e.preventDefault();
    var items=queue.slice();
    if(!formEmpty()||!items.length){var o=collect();if(!o)return;items.push(o)}
    var b=$("sendBtn");b.disabled=true;$("sendLbl").textContent=jt("sending");msg("formMsg","");
    var many=items.length>1,job;
    try{
      if(!many)job=post(items[0]);
      else{var ps=parts(items),bid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);job=Promise.resolve();
        ps.forEach(function(p,i){job=job.then(function(){return post({v:1,t:Date.now(),type:"lists",bid:bid,part:i+1,of:ps.length,items:p})})});
        job=job.then(function(){return post(items[0]).catch(function(){})})}
    }catch(x){job=Promise.reject(x)}
    job.then(function(){queue=[];clearForm();drawQ();$("doneP").textContent=jt(many?"done_pn":"done_p");view("vDone")},function(){msg("formMsg",jt("e_net"))})
      .then(function(){b.disabled=false;label()});
  };
})();
</script>
